<style>
/* Layout: campus playfield left, signboard column right (controls, co-op, shop, info); stacks on phones. Single outdoor look. */
:root {
  --ink: #16302a;
  --board: #22443a;
  --board-hi: #2c574a;
  --line: #3b6b5c;
  --paper: #f4efdf;
  --muted: #b9c9bd;
  --gold: #f2b632;
  --gold-ink: #3a2a05;
  --heart: #ef5a46;
  --sky: #5fc4f0;
  --display: "Lilita One", "Noto Sans TC", system-ui, sans-serif;
  --body: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--paper); font-family: var(--body); font-size: 15px; }
.app {
  max-width: 1300px; margin: 0 auto;
  padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 12px;
}
.hud { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
.hud h1 { font-family: var(--display); font-weight: 400; font-size: 30px; letter-spacing: .02em; margin: 0 auto 0 0; text-wrap: balance; }
.hud h1 span { color: var(--gold); }
.hud h1 small { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: .04em; }
.stat { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.stat small { font-size: 12px; letter-spacing: .12em; color: var(--muted); }
.stat b { font-family: var(--display); font-weight: 400; font-size: 26px; }
.stat.lives b { color: var(--heart); }
.stat.money b { color: var(--gold); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
.stage { position: relative; min-width: 0; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 3px var(--line), 0 12px 30px rgba(0,0,0,.35); background: #7fae58; }
canvas#game { display: block; width: 100%; max-width: 100%; aspect-ratio: 960 / 560; touch-action: none; cursor: crosshair; }
.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(14,32,26,.72); text-align: center; padding: 16px; }
.overlay h2 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 56px); margin: 0 0 6px; color: var(--gold); }
.overlay p { margin: 0 0 18px; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(14,32,26,.88); padding: 6px 14px; border-radius: 999px; font-size: 14px; pointer-events: none; transition: opacity .25s; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.credit { font-size: 12px; color: var(--muted); margin: 6px 2px 0; }

.side { display: grid; gap: 12px; min-width: 0; }
.panel { background: var(--board); border-radius: 12px; padding: 12px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.panel h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .16em; color: var(--muted); font-weight: 700; }
.shop { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.card { display: grid; justify-items: center; gap: 2px; padding: 8px 6px 9px; border: 0; border-radius: 10px; background: var(--board-hi); color: var(--paper); font: inherit; cursor: pointer; position: relative; box-shadow: inset 0 0 0 1px var(--line); }
.card:hover { background: #336455; }
.card:focus-visible, .btn:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.card.active { box-shadow: inset 0 0 0 2px var(--gold); }
.card[disabled] { opacity: .45; cursor: not-allowed; }
.card canvas { width: 54px; height: 54px; }
.card .nm { font-weight: 700; font-size: 14px; }
.card .cost { font-family: var(--display); color: var(--gold); font-size: 17px; font-variant-numeric: tabular-nums; }
.card kbd { position: absolute; top: 5px; left: 7px; font: 700 11px var(--body); color: var(--muted); }
.card.hero { grid-column: 1 / -1; grid-template-columns: auto 1fr auto; justify-items: start; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; }
.card.hero canvas { width: 50px; height: 50px; }
.card.hero .nm { font-size: 16px; }
.card.hero .sub { font-size: 12px; color: var(--muted); }
.card.hero kbd { position: static; }

.info { min-height: 150px; font-size: 14px; line-height: 1.55; }
.info p { margin: 0 0 8px; color: var(--muted); }
.info .title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.info .title b { font-size: 17px; color: var(--paper); }
.info .title span { font-family: var(--display); color: var(--gold); }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--muted); }
.stats dd { margin: 0; text-align: right; }
.xpbar { height: 8px; border-radius: 4px; background: var(--ink); overflow: hidden; margin: -4px 0 10px; }
.xpbar i { display: block; height: 100%; background: var(--sky); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 auto; }
label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); letter-spacing: .06em; }
input[type=text] { width: 100%; box-sizing: border-box; border: 0; border-radius: 8px; padding: 9px 10px; font: 500 15px var(--body); background: var(--ink); color: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
input.code { text-transform: uppercase; letter-spacing: .3em; font-family: var(--display); font-size: 18px; }

.btn { border: 0; border-radius: 10px; padding: 10px 12px; font: 700 15px var(--body); cursor: pointer; background: var(--board-hi); color: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.btn:hover { background: #336455; }
.btn.primary { background: var(--gold); color: var(--gold-ink); box-shadow: 0 3px 0 #a87a14; }
.btn.primary:hover { background: #f7c34e; }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 #a87a14; }
.btn.sky { background: var(--sky); color: #06293a; box-shadow: 0 3px 0 #2c86ad; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.on { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
.btn small { font-weight: 500; opacity: .8; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.controls .btn.primary, .controls .btn.sky { grid-column: 1 / -1; font-size: 17px; padding: 12px; }
.keys { font-size: 12px; color: var(--muted); line-height: 1.6; }

.coop { display: grid; gap: 10px; }
.coop .codebox { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--ink); border-radius: 10px; padding: 8px 12px; }
.coop .codebox b { font-family: var(--display); font-size: 28px; letter-spacing: .25em; color: var(--gold); }
.players { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
.players li { display: flex; align-items: center; gap: 8px; min-width: 0; }
.players li span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.players li em { font-style: normal; font-size: 12px; color: var(--muted); }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px rgba(0,0,0,.25); }
.note { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.5; }

@media (max-width: 960px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .side { grid-template-columns: 1fr 1fr; }
  .side .controls-panel { grid-column: 1 / -1; order: -1; }
}
@media (max-width: 600px) {
  .side { grid-template-columns: minmax(0, 1fr); }
  .shop { grid-template-columns: repeat(4, 1fr); }
  .card canvas { width: 40px; height: 40px; }
  .card .nm { font-size: 12px; }
  .card kbd { display: none; }
  .hud h1 { font-size: 24px; width: 100%; }
  .stat b { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

      <section class="panel info" id="info"></section>
    </aside>
  </div>
</div>

    let t = ((px-s.x1)*dx + (py-s.y1)*dy) / (dx*dx+dy*dy);

    return Math.hypot(px-(s.x1+dx*t), py-(s.y1+dy*t));

    const q = []; let t = 0;
    for (const [kind, count, gap] of WAVES[n-1]) {
      for (let i = 0; i < count; i++) { q.push({t, kind}); t += gap; }
      t += 1.2;
    }
    return q;
  }

  // =====================================================================
  // DOM
  // =====================================================================
  const $ = id => document.getElementById(id);
  const canvas = $('game'), ctx = canvas.getContext('2d');
  const overlay = $('overlay'), toastEl = $('toast');
  const shopEl = $('shop'), infoEl = $('info'), coopBody = $('coopBody'), nickEl = $('nick');
  const startBtn = $('startBtn'), speedBtn = $('speedBtn'), autoBtn = $('autoBtn'), abilityBtn = $('abilityBtn');

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  // avatar
  let avatarImg = null;
  if (window.BD_AVATAR) {
    avatarImg = new Image();
    avatarImg.onload = () => { drawShopIcons(); };
    avatarImg.src = window.BD_AVATAR;
  }

  // players
  const PLAYER_COLORS = ['#f2b632','#5fc4f0','#ef6aa0','#8be06a','#c39bff','#ff9a4a'];
  let myColor = parseInt(store.get('bd-color') ?? '', 10);
  if (!(myColor >= 0 && myColor < PLAYER_COLORS.length)) { myColor = Math.floor(Math.random() * PLAYER_COLORS.length); store.set('bd-color', String(myColor)); }
  nickEl.value = store.get('bd-nick') || '';
  const myNick = () => (nickEl.value.trim() || '玩家').slice(0, 12);

  // =====================================================================
  // State
  // =====================================================================
  let S;
  function freshState() {
    return {
      money: 650, lives: 100, round: 0,
      inRound: false, queue: [], roundT: 0,
      balloons: [], towers: [], shots: [], fx: [], netfx: [],
      placing: null, selectedId: null, hover: null,
      speed: 1, auto: false, autoTimer: 0, over: 0, time: 0, nextId: 1, nextTid: 1,
      heroXp: 0, abilityCd: 0, heroName: store.get('bd-hero') || '主角',
    };
  }
  function reset() {
    const keep = S ? {placing: null} : {};
    S = Object.assign(freshState(), keep);
    overlay.hidden = true;
    refreshUI(); renderInfo();
  }
  const heroTower = () => S.towers.find(t => t.type === 'hero');
  const selected = () => S.towers.find(t => t.id === S.selectedId) || null;
  function heroLevel(xp = S.heroXp) {
    const L = TOWERS.hero.levels; let i = 0;
    while (i + 1 < L.length && xp >= L[i+1].xp) i++;
    return i;
  }
  function towerLevel(tw) { return TOWERS[tw.type].levels[tw.lvl]; }

  // =====================================================================
  // UI
  // =====================================================================
  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.style.opacity = 1;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.style.opacity = 0, 1800);
  }

  const cardEls = {};
  for (const type of TYPES) {
    const t = TOWERS[type];
    const b = document.createElement('button');
    b.className = 'card' + (type === 'hero' ? ' hero' : ''); b.id = 'buy-' + type;
    if (type === 'hero') {
      b.innerHTML = `<canvas width="100" height="100"></canvas><span><span class="nm" id="heroCardName"></span><br><span class="sub">英雄 · 全場只能一位</span></span><span><kbd>5</kbd> <span class="cost">$${t.cost}</span></span>`;
      shopEl.prepend(b);
    } else {
      b.innerHTML = `<kbd>${t.key}</kbd><canvas width="108" height="108"></canvas><span class="nm">${t.name}</span><span class="cost">$${t.cost}</span>`;
      shopEl.appendChild(b);
    }
    b.addEventListener('click', () => choose(type));
    cardEls[type] = b;
  }
  function drawShopIcons() {
    for (const type of TYPES) {
      const cv = cardEls[type].querySelector('canvas'), c = cv.getContext('2d');
      c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, cv.width, cv.height); c.scale(2, 2);
      if (type === 'hero') drawHero(c, 25, 24, 0, 1.05, 0, null, -1);
      else drawTower(c, type, 27, 26, -Math.PI/4, 0, 1.15, 0, null);
    }
  }

  function canAfford(type) { return S.money >= TOWERS[type].cost; }
  function heroTaken() { return !!heroTower(); }

  function choose(type) {
    if (S.over) return;
    if (S.placing === type) { S.placing = null; refreshUI(); renderInfo(); return; }
    if (type === 'hero' && heroTaken()) { toast('主角已經在場上了'); return; }
    if (!canAfford(type)) { toast('金幣不足'); return; }
    S.placing = type; S.selectedId = null;
    refreshUI(); renderInfo();
  }

  function refreshUI() {
    $('lives').textContent = Math.max(0, S.lives);
    $('money').textContent = S.money;
    $('round').textContent = `${S.round} / ${WAVES.length}`;
    $('heroCardName').textContent = S.heroName;
    for (const type of TYPES) {
      cardEls[type].disabled = (!canAfford(type) || (type === 'hero' && heroTaken())) && S.placing !== type;
      cardEls[type].classList.toggle('active', S.placing === type);
    }
    startBtn.disabled = S.inRound || !!S.over || S.round >= WAVES.length;
    startBtn.innerHTML = S.inRound ? `第 ${S.round} 回合進行中…` : S.round >= WAVES.length ? '全部回合完成' : `開始第 ${S.round + 1} 回合 <small>(空白鍵)</small>`;
    speedBtn.textContent = `速度 ×${S.speed}`;
    speedBtn.classList.toggle('on', S.speed > 1);
    autoBtn.classList.toggle('on', S.auto);
    refreshAbility();
  }
  function refreshAbility() {
    const h = heroTower();
    const ready = h && heroLevel() >= 4;
    abilityBtn.hidden = !ready;
    if (ready) {
      const cd = Math.ceil(S.abilityCd);
      abilityBtn.disabled = cd > 0 || !!S.over;
      abilityBtn.innerHTML = cd > 0 ? `能量爆發 <small>${cd} 秒後可用</small>` : `能量爆發 <small>(Q)</small>`;
    }
  }

  function statRows(type, L) {
    const r = [];
    r.push(['射程', L.range >= 2000 ? '全地圖' : L.range]);
    r.push(['攻擊間隔', L.cd + ' 秒']);
    if (L.dmg) r.push(['傷害', L.dmg]);
    if (L.pierce) r.push(['穿透', L.pierce + (L.shots > 1 ? ` × ${L.shots} 發` : '')]);
    if (L.blast) r.push(['爆炸半徑', L.blast]);
    if (L.slow) r.push(['減速', Math.round((1-L.slow)*100) + '%']);
    r.push(['打鐵氣球', L.iron ? '可以' : '不行']);
    return r.map(([a,b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('');
  }
  const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  let infoKey = '';
  function renderInfo(force = true) {
    const tw = selected();
    const key = S.placing ? 'p:' + S.placing : tw ? `t:${tw.id}:${tw.lvl}:${tw.type === 'hero' ? heroLevel() : ''}` : 'help';
    if (!force && key === infoKey) { updateInfoLive(); return; }
    infoKey = key;
    if (S.placing) {
      const t = TOWERS[S.placing];
      infoEl.innerHTML = `<div class="title"><b>${esc(S.placing === 'hero' ? S.heroName : t.name)}</b><span>$${t.cost}</span></div>
        <p>${t.desc}</p><dl class="stats">${statRows(S.placing, t.levels[0])}</dl>
        <p>點校園的草地放置。不能放在跑道、河裡或大樓上。</p>
        <div class="row"><button class="btn" id="cancelPlace">取消 (Esc)</button></div>`;
      $('cancelPlace').onclick = () => { S.placing = null; refreshUI(); renderInfo(); };
      return;
    }
    if (tw && tw.type === 'hero') {
      const lv = heroLevel(), L = TOWERS.hero.levels[lv], next = TOWERS.hero.levels[lv+1];
      const refund = Math.floor(tw.spent * .7);
      infoEl.innerHTML = `<div class="title"><b>${esc(S.heroName)}</b><span>等級 ${lv+1}</span></div>
        <div class="xpbar"><i id="xpFill"></i></div>
        <p id="xpText"></p>
        <dl class="stats">${statRows('hero', L)}<dt>已擊破</dt><dd id="popsLive">${tw.pops}</dd></dl>
        <label class="field" style="margin-bottom:10px">主角名字
          <input type="text" id="heroName" maxlength="10" value="${esc(S.heroName)}" autocomplete="off">
        </label>
        <div class="row"><button class="btn" id="sellBtn">賣出 +$${refund}</button><button class="btn" id="deselBtn">關閉</button></div>`;
      $('heroName').addEventListener('change', e => act({a:'hname', n:e.target.value}));
      $('sellBtn').onclick = () => act({a:'sell', id:tw.id});
      $('deselBtn').onclick = () => { S.selectedId = null; renderInfo(); };
      updateInfoLive();
      return;
    }
    if (tw) {
      const t = TOWERS[tw.type], L = t.levels[tw.lvl], next = t.levels[tw.lvl+1];
      const refund = Math.floor(tw.spent * .7);
      const owner = tw.owner != null ? `<dt>蓋的人</dt><dd><span class="dot" style="display:inline-block;background:${PLAYER_COLORS[tw.owner]}"></span></dd>` : '';
      infoEl.innerHTML = `<div class="title"><b>${t.name}</b><span>等級 ${tw.lvl+1}</span></div>
        <dl class="stats">${statRows(tw.type, L)}<dt>已擊破</dt><dd id="popsLive">${tw.pops}</dd>${owner}</dl>
        <div class="row">
          ${next ? `<button class="btn primary" id="upBtn">升級：${next.label} $${next.cost}</button>` : `<button class="btn" disabled>已經滿級</button>`}
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="sellBtn">賣出 +$${refund}</button>
          <button class="btn" id="deselBtn">關閉</button>
        </div>`;
      if (next) $('upBtn').onclick = () => act({a:'up', id:tw.id});
      $('sellBtn').onclick = () => act({a:'sell', id:tw.id});
      $('deselBtn').onclick = () => { S.selectedId = null; renderInfo(); };
      updateInfoLive();
      return;
    }
    infoEl.innerHTML = `<h3>怎麼玩</h3>
      <p>氣球從 Anzac Avenue 的橋上過來，穿過停車場和圓環，沿著校園的跑道衝向中學大樓。讓它們跑進大樓就會扣生命。</p>
      <p>每次擊中會剝掉一層：粉 → 黃 → 綠 → 藍 → 紅。鐵氣球要用炸彈、穿甲彈或 3 級主角，飛艇裡藏著鐵氣球。</p>
      <div class="keys">快捷鍵：1–4 選塔 · 5 主角 · 空白鍵 開始回合 · Q 能量爆發 · U 升級 · S 賣出 · Esc 取消</div>`;
  }
  function updateInfoLive() {
    const tw = selected(); if (!tw) return;
    const p = $('popsLive'); if (p) p.textContent = tw.pops;
    const up = $('upBtn');
    if (up) { const n = TOWERS[tw.type].levels[tw.lvl+1]; up.disabled = !n || S.money < n.cost; }
    if (tw.type === 'hero') {
      const lv = heroLevel(), L = TOWERS.hero.levels, next = L[lv+1];
      const fill = $('xpFill'), txt = $('xpText');
      if (fill) fill.style.width = next ? Math.min(100, (S.heroXp - L[lv].xp) / (next.xp - L[lv].xp) * 100) + '%' : '100%';
      if (txt) txt.textContent = next ? `經驗 ${S.heroXp} / ${next.xp}，下一級：${next.label}` : `已滿級。能量爆發會讓全場氣球各掉一層，飛艇受到重擊。`;
    }
  }

  function canPlace(x, y, type) {
    if (x < 16 || y < 16 || x > W-16 || y > H-16) return false;
    for (const s of segs) if (distToSeg(x,y,s) < PATH_W/2 + 15) return false;
    for (const r of MAP.river) if (inPoly(x, y, r)) return false;
    if (x > GOAL.x - 14 && x < GOAL.x + GOAL.w + 14 && y > GOAL.y - 18 && y < GOAL.y + GOAL.h + 14) return false;
    for (const t of S.towers) if (Math.hypot(t.x-x, t.y-y) < 38) return false;
    return true;
  }

  // =====================================================================
  // Actions: every change to the shared game goes through act().
  // In co-op, guests send actions to the host, who runs the game.
  // =====================================================================
  function act(a) {
    if (NET.role === 'guest') {
      NET.room.emit('act', a).catch(() => toast('沒送出，請再試一次'));
      if (a.a === 'build') { S.placing = null; refreshUI(); renderInfo(); }
      return;
    }
    applyAction(a, myColor, true);
  }

  function applyAction(a, color, local) {
    if (!a || typeof a !== 'object') return;
    const say = msg => { if (local) toast(msg); };
    switch (a.a) {
      case 'build': {
        const type = a.t, x = +a.x, y = +a.y;
        if (!TOWERS[type] || !isFinite(x) || !isFinite(y) || S.over) return;
        const t = TOWERS[type];
        if (type === 'hero' && heroTaken()) return say('主角已經在場上了');
        if (S.money < t.cost) return say('金幣不足');
        if (!canPlace(x, y, type)) return say('這裡不能蓋');
        S.money -= t.cost;
        const tw = {id:S.nextTid++, type, x, y, lvl: type === 'hero' ? heroLevel() : 0, cd:0, ang:-Math.PI/2, spent:t.cost, pops:0, owner: NET.role === 'solo' ? null : color};
        S.towers.push(tw); puff(x, y, '#e8dcb8', 10); net(['r', x, y, 7]);
        if (local) { if (!a.keep || !canAfford(type) || type === 'hero') S.placing = null; }
        break;
      }
      case 'up': {
        const tw = S.towers.find(t => t.id === a.id); if (!tw || tw.type === 'hero') return;
        const next = TOWERS[tw.type].levels[tw.lvl+1]; if (!next) return;
        if (S.money < next.cost) return say('金幣不足');
        S.money -= next.cost; tw.spent += next.cost; tw.lvl++;
        ring(tw.x, tw.y, 30, '#f2b632');
        break;
      }
      case 'sell': {
        const tw = S.towers.find(t => t.id === a.id); if (!tw) return;
        S.money += Math.floor(tw.spent * .7);
        S.towers = S.towers.filter(t => t !== tw);
        puff(tw.x, tw.y, '#c9b28a', 14);
        if (S.selectedId === tw.id) S.selectedId = null;
        break;
      }
      case 'start': startRound(); break;
      case 'speed': S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; break;
      case 'auto': S.auto = !S.auto; if (S.auto && !S.inRound) startRound(); break;
      case 'ability': useAbility(); break;
      case 'hname': {
        const n = String(a.n || '').replace(/[\u0000-\u001f\u007f]/g, '').trim().slice(0, 10);
        if (n) { S.heroName = n; if (local) store.set('bd-hero', n); }
        break;
      }
      case 'restart': reset(); break;
    }
    refreshUI(); renderInfo();
  }

  function startRound() {
    if (S.inRound || S.over || S.round >= WAVES.length) return;
    S.round++; S.inRound = true; S.roundT = 0; S.queue = buildQueue(S.round);
  }

  function useAbility() {
    const h = heroTower();
    if (!h || heroLevel() < 4 || S.abilityCd > 0 || S.over) return;
    S.abilityCd = ABILITY_CD;
    S.fx.push({type:'blast', x:h.x, y:h.y, life:.7, max:.7}); net(['A', h.x, h.y]);
    const list = S.balloons.filter(b => !b.dead);
    for (const b of list) damage(b, b.kind === 'blimp' ? 30 : 1, true, h);
    refreshUI();
  }

  // =====================================================================
  // Input
  // =====================================================================
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height};
  }
  canvas.addEventListener('pointermove', e => { S.hover = toWorld(e); });
  canvas.addEventListener('pointerleave', () => { S.hover = null; });
  canvas.addEventListener('contextmenu', e => { e.preventDefault(); S.placing = null; S.selectedId = null; refreshUI(); renderInfo(); });
  canvas.addEventListener('pointerdown', e => {
    if (S.over || e.button === 2) return;
    const p = toWorld(e); S.hover = p;
    if (S.placing) {
      if (!canPlace(p.x, p.y, S.placing)) { toast('這裡不能蓋'); return; }
      act({a:'build', t:S.placing, x:Math.round(p.x), y:Math.round(p.y), keep: e.shiftKey});
      return;
    }
    let hit = null;
    for (const t of S.towers) if (Math.hypot(t.x-p.x, t.y-p.y) < 22) hit = t;
    S.selectedId = hit ? hit.id : null; renderInfo();
  });

  window.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    const k = e.key.toLowerCase();
    const idx = ['1','2','3','4','5'].indexOf(k);
    if (idx >= 0) choose(['dart','bomb','frost','sniper','hero'][idx]);
    else if (k === ' ') { e.preventDefault(); act({a:'start'}); }
    else if (k === 'escape') { S.placing = null; S.selectedId = null; refreshUI(); renderInfo(); }
    else if (k === 'u') { const t = selected(); if (t) act({a:'up', id:t.id}); }
    else if (k === 's') { const t = selected(); if (t) act({a:'sell', id:t.id}); }
    else if (k === 'q') act({a:'ability'});
  });

  startBtn.onclick = () => act({a:'start'});
  speedBtn.onclick = () => act({a:'speed'});
  autoBtn.onclick = () => act({a:'auto'});
  abilityBtn.onclick = () => act({a:'ability'});
  $('restart').onclick = () => act({a:'restart'});
  nickEl.addEventListener('change', () => { store.set('bd-nick', nickEl.value.trim()); NET.room && NET.room.presence({nick: myNick(), color: myColor, host: NET.role === 'host'}).catch(() => {}); });

  // =====================================================================
  // Combat (runs on the host, or alone in solo play)
  // =====================================================================
  function spawn(kind, dist = 0) {
    const inf = info(kind);
    const b = {id:S.nextId++, kind, dist, hp:inf.hp || 0, slowUntil:0, slowF:1, dead:false};
    S.balloons.push(b); return b;
  }
  const bpos = b => posAt(b.dist);
  const radius = b => info(b.kind).r;

  function credit(tower, n) {
    if (!tower) return;
    tower.pops += n;
    if (tower.type === 'hero') {
      const before = heroLevel();
      S.heroXp += n;
      const after = heroLevel();
      if (after > before) { tower.lvl = after; ring(tower.x, tower.y, 34, '#5fc4f0'); toast(`${S.heroName} 升到 ${after + 1} 級：${TOWERS.hero.levels[after].label}`); net(['t', after]); }
    }
  }

  function damage(b, dmg, canIron, tower) {
    if (b.dead) return false;
    const p = bpos(b);
    if (b.kind === 'iron' && !canIron) { floatText(p.x, p.y - 16, '叮', '#dfe5ea'); return false; }
    if (typeof b.kind === 'number') {
      const popped = Math.min(dmg, b.kind + 1);
      S.money += popped; credit(tower, popped);
      puff(p.x, p.y, CHAIN[b.kind].color, 6); net(['p', p.x, p.y, b.kind]);
      b.kind -= dmg;
      if (b.kind < 0) b.dead = true;
      return true;
    }
    b.hp -= dmg;
    const s = SPECIAL[b.kind];
    if (b.hp <= 0) {
      b.dead = true;
      S.money += s.bounty; credit(tower, b.kind === 'blimp' ? 10 : 2);
      const big = b.kind === 'blimp';
      puff(p.x, p.y, s.color, big ? 30 : 10); ring(p.x, p.y, big ? 60 : 20, '#ffffff');
      net(['p', p.x, p.y, big ? 6 : 5]); net(['r', p.x, p.y, big ? 60 : 20]);
      for (let i = 0; i < s.kids.n; i++) spawn(s.kids.kind, Math.max(0, b.dist - i * 14));
    } else puff(p.x, p.y, '#d7dde2', 3);
    return true;
  }

  function findTarget(tw, L) {
    let best = null, bestD = -1;
    for (const b of S.balloons) {
      if (b.dead) continue;
      if (b.kind === 'iron' && !L.iron) continue;
      const p = bpos(b);
      if (Math.hypot(p.x-tw.x, p.y-tw.y) > L.range + radius(b)) continue;
      if (b.dist > bestD) { bestD = b.dist; best = b; }
    }
    return best;
  }

  function updateTower(tw, dt) {
    if (tw.type === 'hero') tw.lvl = heroLevel();
    const L = towerLevel(tw);
    tw.cd -= dt;
    if (tw.type === 'frost') {
      if (tw.cd > 0) return;
      const inRange = S.balloons.filter(b => !b.dead && Math.hypot(bpos(b).x-tw.x, bpos(b).y-tw.y) <= L.range + radius(b));
      if (!inRange.length) return;
      tw.cd = L.cd;
      S.fx.push({type:'frost', x:tw.x, y:tw.y, r:L.range, life:.45, max:.45}); net(['f', tw.x, tw.y, L.range]);
      for (const b of inRange) {
        b.slowUntil = S.time + L.dur;
        b.slowF = b.kind === 'blimp' ? Math.max(L.slow, .75) : L.slow;
        if (L.dmg) damage(b, L.dmg, false, tw);
      }
      return;
    }
    const target = findTarget(tw, L);
    if (!target) return;
    const tp = bpos(target);
    tw.ang = Math.atan2(tp.y - tw.y, tp.x - tw.x);
    if (tw.cd > 0) return;
    tw.cd = L.cd;
    const reach = tw.type === 'hero' ? 16 : 20;
    const mx = tw.x + Math.cos(tw.ang) * reach, my = tw.y + Math.sin(tw.ang) * reach;
    if (tw.type === 'dart' || tw.type === 'hero') {
      const hero = tw.type === 'hero';
      const spread = L.shots > 1 ? .22 : 0, speed = hero ? 540 : 620;
      for (let i = 0; i < L.shots; i++) {
        const a = tw.ang + (i - (L.shots-1)/2) * spread;
        S.shots.push({type: hero ? 'orb' : 'dart', x:mx, y:my, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, life:.5, pierce:L.pierce, dmg:L.dmg, iron:!!L.iron, hit:new Set(), tw});
        net([hero ? 'h' : 'd', mx, my, mx + Math.cos(a) * speed * .5, my + Math.sin(a) * speed * .5]);
      }
    } else if (tw.type === 'bomb') {
      S.shots.push({type:'bomb', x:mx, y:my, target, tx:tp.x, ty:tp.y, speed:420, dmg:L.dmg, blast:L.blast, tw});
      net(['b', mx, my, tp.x, tp.y, L.blast]);
    } else if (tw.type === 'sniper') {
      S.fx.push({type:'tracer', x1:mx, y1:my, x2:tp.x, y2:tp.y, life:.09, max:.09}); net(['s', mx, my, tp.x, tp.y]);
      damage(target, L.dmg, L.iron, tw);
    }
  }

  function updateShot(s, dt) {
    if (s.type === 'dart' || s.type === 'orb') {
      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
      if (s.life <= 0 || s.x < -20 || s.y < -20 || s.x > W+20 || s.y > H+20) return false;
      for (const b of S.balloons) {
        if (b.dead || s.hit.has(b.id)) continue;
        const p = bpos(b);
        if (Math.hypot(p.x - s.x, p.y - s.y) < radius(b) + 4) {
          s.hit.add(b.id);
          if (!damage(b, s.dmg, s.iron, s.tw)) return false;
          if (--s.pierce <= 0) return false;
        }
      }
      return true;
    }
    if (s.type === 'bomb') {
      if (s.target && !s.target.dead) { const p = bpos(s.target); s.tx = p.x; s.ty = p.y; }
      const dx = s.tx - s.x, dy = s.ty - s.y, d = Math.hypot(dx, dy), step = s.speed * dt;
      if (d <= step + 4) {
        const hits = S.balloons.filter(b => !b.dead && Math.hypot(bpos(b).x - s.tx, bpos(b).y - s.ty) <= s.blast + radius(b) * .5);
        for (const b of hits) damage(b, s.dmg, true, s.tw);
        S.fx.push({type:'boom', x:s.tx, y:s.ty, r:s.blast, life:.3, max:.3});
        return false;
      }
      s.x += dx / d * step; s.y += dy / d * step;
      return true;
    }
    return false;
  }

  function step(dt) {
    S.time += dt;
    if (S.abilityCd > 0) S.abilityCd = Math.max(0, S.abilityCd - dt);
    if (S.inRound) {
      S.roundT += dt;
      while (S.queue.length && S.queue[0].t <= S.roundT) spawn(S.queue.shift().kind);
    }
    for (const b of S.balloons) {
      if (b.dead) continue;
      const slow = b.slowUntil > S.time ? b.slowF : 1;
      b.dist += info(b.kind).speed * SPEED_SCALE * slow * dt;
      if (b.dist >= PATH_LEN) { b.dead = true; S.lives -= rbe(b.kind); }
    }
    for (const tw of S.towers) updateTower(tw, dt);
    S.shots = S.shots.filter(s => updateShot(s, dt));
    S.balloons = S.balloons.filter(b => !b.dead);
    stepFx(dt);

    if (S.lives <= 0 && !S.over) {
      S.over = 1; S.lives = 0;
      showOverlay();
    }
    if (S.inRound && !S.queue.length && !S.balloons.length && !S.over) {
      S.inRound = false;
      const bonus = 100 + S.round * 10;
      S.money += bonus; toast(`第 ${S.round} 回合完成，獎勵 $${bonus}`); net(['w', S.round, bonus]);
      if (heroTower()) credit(heroTower(), 5);
      if (S.round >= WAVES.length) { S.over = 2; showOverlay(); }
      else if (S.auto) S.autoTimer = 1.2;
      refreshUI(); renderInfo(false);
    }
    if (S.autoTimer > 0) { S.autoTimer -= dt; if (S.autoTimer <= 0 && S.auto) { startRound(); refreshUI(); } }
  }
  function stepFx(dt) {
    for (const f of S.fx) {
      f.life -= dt;
      if (f.vx !== undefined) { f.x += f.vx*dt; f.y += f.vy*dt; if (f.type === 'bit') f.vy += 300*dt; }
    }
    S.fx = S.fx.filter(f => f.life > 0);
  }

  function showOverlay() {
    if (S.over === 1) {
      $('ovTitle').textContent = '大樓被攻陷了';
      $('ovText').textContent = `你們撐到了第 ${S.round} 回合。換個塔的位置再試試看。`;
    } else {
      $('ovTitle').textContent = '守住學校了！';
      $('ovText').textContent = `20 個回合全部擋下，剩下 ${S.lives} 點生命。`;
    }
    $('restart').hidden = NET.role === 'guest';
    overlay.hidden = false; refreshUI();
  }

  // =====================================================================
  // Effects
  // =====================================================================
  function puff(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 120;
      S.fx.push({type:'bit', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 40, life:.35 + Math.random()*.2, max:.5, color});
    }
  }
  function ring(x, y, r, color) { S.fx.push({type:'ring', x, y, r, color, life:.25, max:.25}); }
  function floatText(x, y, text, color) { S.fx.push({type:'text', x, y, text, color, life:.5, max:.5}); }

  // =====================================================================
  // Co-op networking (claude.ai `room` capability). Host runs the game and
  // sends snapshots; guests send actions and draw what the host sends.
  // =====================================================================
  const NET = {api:null, room:null, role:'solo', code:'', hostPeer:null, sendTimer:0, lastSnap:0, offs:[], joinTimer:0, status:''};
  function net(ev) {
    if (NET.role !== 'host') return;
    S.netfx.push(ev.map(v => typeof v === 'number' ? Math.round(v) : v));
    if (S.netfx.length > 80) S.netfx.splice(0, S.netfx.length - 80);
  }

  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const KIND_CH = {0:'0',1:'1',2:'2',3:'3',4:'4',iron:'i',blimp:'m'};
  const KIND_SLOW = {0:'5',1:'6',2:'7',3:'8',4:'9',iron:'j',blimp:'n'};
  const CH_KIND = {'0':[0,0],'1':[1,0],'2':[2,0],'3':[3,0],'4':[4,0],'i':['iron',0],'m':['blimp',0],'5':[0,1],'6':[1,1],'7':[2,1],'8':[3,1],'9':[4,1],'j':['iron',1],'n':['blimp',1]};

  function makeSnap(withFx) {
    let bs = '', bh = [];
    for (const b of S.balloons) {
      if (b.dead) continue;
      const slow = b.slowUntil > S.time;
      bs += (slow ? KIND_SLOW : KIND_CH)[b.kind] + Math.max(0, Math.min(46655, Math.round(b.dist))).toString(36).padStart(3, '0');
      if (b.kind === 'blimp') bh.push(Math.max(0, Math.round(b.hp)));
    }
    const snap = {
      m:S.money, l:Math.max(0, S.lives), r:S.round, ir:S.inRound ? 1 : 0, sp:S.speed, au:S.auto ? 1 : 0, ov:S.over,
      xp:S.heroXp, ac:Math.ceil(S.abilityCd), hn:S.heroName,
      t:S.towers.map(t => [t.id, TYPES.indexOf(t.type), Math.round(t.x), Math.round(t.y), t.lvl, Math.round(t.ang * 100), t.owner == null ? -1 : t.owner, t.pops, t.spent]),
      b:bs, bh, f: withFx ? S.netfx : [],
    };
    let txt = JSON.stringify(snap);
    while (txt.length > 3900 && snap.f.length) { snap.f = snap.f.slice(Math.ceil(snap.f.length / 2)); if (snap.f.length < 4) snap.f = []; txt = JSON.stringify(snap); }
    if (txt.length > 3900) { snap.b = snap.b.slice(0, Math.max(0, snap.b.length - (txt.length - 3850))); snap.b = snap.b.slice(0, snap.b.length - snap.b.length % 4); }
    return snap;
  }

  function applySnap(d) {
    if (!d || typeof d !== 'object') return;
    const num = (v, def = 0) => (typeof v === 'number' && isFinite(v)) ? v : def;
    S.money = num(d.m); S.lives = num(d.l); S.round = num(d.r); S.inRound = !!d.ir; S.speed = num(d.sp, 1); S.auto = !!d.au;
    S.heroXp = num(d.xp); S.abilityCd = num(d.ac);
    if (typeof d.hn === 'string') S.heroName = d.hn.slice(0, 10);
    const prevOver = S.over; S.over = num(d.ov);
    if (S.over && !prevOver) showOverlay();
    if (!S.over && prevOver) overlay.hidden = true;
    if (Array.isArray(d.t)) {
      const old = new Map(S.towers.map(t => [t.id, t]));
      S.towers = d.t.filter(a => Array.isArray(a) && TYPES[a[1]]).map(a => {
        const prev = old.get(a[0]);
        return {id:a[0], type:TYPES[a[1]], x:num(a[2]), y:num(a[3]), lvl:num(a[4]), ang: prev ? prev.ang : num(a[5]) / 100, tang:num(a[5]) / 100, owner:a[6] >= 0 ? a[6] : null, pops:num(a[7]), spent:num(a[8]), cd:0};
      });
    }
    if (typeof d.b === 'string') {
      const list = []; let bi = 0;
      for (let i = 0; i + 4 <= d.b.length; i += 4) {
        const k = CH_KIND[d.b[i]]; if (!k) continue;
        const dist = parseInt(d.b.slice(i+1, i+4), 36);
        const b = {id:i, kind:k[0], dist, hp:0, slowUntil: k[1] ? S.time + .3 : 0, slowF:.5, dead:false};
        if (k[0] === 'blimp') b.hp = num((d.bh || [])[bi++], 150);
        list.push(b);
      }
      S.balloons = list;
    }
    if (Array.isArray(d.f)) for (const e of d.f) playNetFx(e);
    NET.lastSnap = performance.now();
    refreshUI(); renderInfo(false);
  }

  function playNetFx(e) {
    if (!Array.isArray(e)) return;
    const n = i => (typeof e[i] === 'number' && isFinite(e[i])) ? e[i] : 0;
    switch (e[0]) {
      case 'p': puff(n(1), n(2), POP_COLORS[n(3)] || '#fff', 6); break;
      case 'r': ring(n(1), n(2), n(3), '#ffffff'); break;
      case 'd': case 'h': {
        const dx = n(3) - n(1), dy = n(4) - n(2), len = Math.hypot(dx, dy) || 1, sp = e[0] === 'h' ? 540 : 620;
        S.fx.push({type: e[0] === 'h' ? 'vorb' : 'vdart', x:n(1), y:n(2), vx:dx/len*sp, vy:dy/len*sp, life:.35, max:.35});
        break;
      }
      case 'b': {
        const dx = n(3) - n(1), dy = n(4) - n(2), len = Math.hypot(dx, dy) || 1, t = len / 420;
        S.fx.push({type:'vbomb', x:n(1), y:n(2), vx:dx/t, vy:dy/t, life:t, max:t, bx:n(3), by:n(4), blast:n(5)});
        break;
      }
      case 's': S.fx.push({type:'tracer', x1:n(1), y1:n(2), x2:n(3), y2:n(4), life:.09, max:.09}); break;
      case 'f': S.fx.push({type:'frost', x:n(1), y:n(2), r:n(3), life:.45, max:.45}); break;
      case 'A': S.fx.push({type:'blast', x:n(1), y:n(2), life:.7, max:.7}); break;
      case 'w': toast(`第 ${n(1)} 回合完成，獎勵 $${n(2)}`); break;
      case 't': toast(`${S.heroName} 升到 ${n(1) + 1} 級`); break;
    }
  }

  function guestStep(dt) {
    S.time += dt;
    for (const b of S.balloons) {
      const slow = b.slowUntil > S.time ? b.slowF : 1;
      b.dist = Math.min(PATH_LEN, b.dist + info(b.kind).speed * SPEED_SCALE * slow * dt * S.speed);
    }
    for (const t of S.towers) if (t.tang !== undefined) t.ang += angDiff(t.ang, t.tang) * Math.min(1, dt * 12);
    for (const f of S.fx) if (f.type === 'vbomb' && f.life - dt <= 0) S.fx.push({type:'boom', x:f.bx, y:f.by, r:f.blast, life:.3, max:.3});
    stepFx(dt);
    if (NET.role === 'guest' && NET.lastSnap && performance.now() - NET.lastSnap > 6000) {
      if (performance.now() - NET.lastSnap > 12000) leaveRoom('房主那邊斷線了，回到單人遊戲。');
      else if (!NET.status) { NET.status = '暫時收不到房主的畫面…'; renderCoop(); }
    }
  }
  const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2*Math.PI; while (d < -Math.PI) d += 2*Math.PI; return d; };

  function presenceOf(peer) { const p = peer && peer.presence || {}; return {nick: typeof p.nick === 'string' ? p.nick.slice(0, 12) : '玩家', color: (p.color >= 0 && p.color < PLAYER_COLORS.length) ? p.color : 0, host: p.host === true}; }

  function renderCoop() {
    if (!NET.api) {
      coopBody.innerHTML = `<p class="note" id="coopNote">${NET.status || '正在檢查能不能連線…'}</p>`;
      return;
    }
    if (NET.role === 'solo') {
      coopBody.innerHTML = `<div class="row"><button class="btn primary" id="hostBtn">建立房間</button></div>
        <div class="row" style="align-items:end">
          <label class="field" style="flex:1 1 90px">朋友給的房號<input type="text" class="code" id="codeIn" maxlength="4" autocomplete="off" placeholder="ABCD"></label>
          <button class="btn" id="joinBtn" style="flex:0 0 auto">加入</button>
        </div>
        <p class="note">${esc(NET.status) || '一起守同一間學校：金幣和生命共用，誰都可以蓋塔、升級。'}</p>`;
      $('hostBtn').onclick = hostRoom;
      $('joinBtn').onclick = () => joinRoom($('codeIn').value);
      $('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(e.target.value); });
      return;
    }
    coopBody.innerHTML = `<div class="codebox"><span class="note">房號</span><b>${esc(NET.code)}</b></div>
      <ul class="players" id="players"></ul>
      <p class="note">${esc(NET.status) || (NET.role === 'host' ? '把房號告訴朋友，他們在同一個連結輸入就能加入。你的分頁要保持開著，遊戲才會繼續。' : '已加入，遊戲由房主那邊運行。')}</p>
      <div class="row"><button class="btn" id="leaveBtn">離開房間</button></div>`;
    $('leaveBtn').onclick = leaveRoom;
    renderPlayers();
  }
  function renderPlayers() {
    const ul = $('players'); if (!ul || !NET.room) return;
    ul.textContent = '';
    for (const p of NET.room.peers()) {
      const pr = presenceOf(p);
      const li = document.createElement('li');
      const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = PLAYER_COLORS[pr.color];
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = pr.nick;
      const tag = document.createElement('em'); tag.textContent = [pr.host ? '房主' : '', p.sameTab ? '你' : ''].filter(Boolean).join(' · ');
      li.append(dot, nm, tag); ul.appendChild(li);
    }
  }

  async function connectRoom(name) {
    const r = await NET.api.join(name);
    NET.room = r;
    await r.presence({nick: myNick(), color: myColor, host: NET.role === 'host'}).catch(() => {});
    NET.offs.push(r.onPeers(change => {
      renderPlayers();
      if (NET.role === 'host' && change.joined.some(p => !p.sameTab)) {
        for (const p of change.joined) if (!p.sameTab) toast(`${presenceOf(p).nick} 加入了`);
      }
      if (NET.role === 'guest') {
        const hostHere = change.peers.some(p => NET.hostPeer ? p.peer === NET.hostPeer : presenceOf(p).host);
        if (NET.hostPeer && change.left.some(p => p.peer === NET.hostPeer)) {
          leaveRoom('房主離開了，回到單人遊戲。');
        } else if (!hostHere && NET.joinedAt && performance.now() - NET.joinedAt > 6000 && !NET.lastSnap) {
          leaveRoom('找不到這個房間，請確認房號。');
        }
      }
    }, () => leaveRoom('連線中斷了，回到單人遊戲。')));
    return r;
  }

  async function hostRoom() {
    if (NET.role !== 'solo') return;
    store.set('bd-nick', nickEl.value.trim());
    let code = ''; for (let i = 0; i < 4; i++) code += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)];
    NET.role = 'host'; NET.code = code; NET.status = '連線中…'; renderCoop();
    try {
      const r = await connectRoom('bd-' + code.toLowerCase());
      NET.offs.push(r.on('act', msg => {
        if (msg.sameTab) return;
        const peer = r.peers().find(p => p.peer === msg.peer);
        applyAction(msg.data, presenceOf(peer).color, false);
      }));
      NET.status = ''; renderCoop(); refreshUI();
      toast(`房間建立好了，房號 ${code}`);
    } catch (e) {
      NET.role = 'solo'; NET.room = null; NET.status = '沒辦法建立房間，請稍後再試。'; renderCoop();
    }
  }

  async function joinRoom(raw) {
    if (NET.role !== 'solo') return;
    const code = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 4) { NET.status = '房號是 4 個字。'; renderCoop(); return; }
    store.set('bd-nick', nickEl.value.trim());
    if (document.activeElement) document.activeElement.blur();
    NET.role = 'guest'; NET.code = code; NET.status = '連線中…'; NET.lastSnap = 0; NET.hostPeer = null; renderCoop();
    try {
      const r = await connectRoom('bd-' + code.toLowerCase());
      NET.joinedAt = performance.now();
      S = freshState(); overlay.hidden = true;
      NET.offs.push(r.on('snap', msg => {
        if (msg.sameTab) return;
        if (NET.hostPeer && msg.peer !== NET.hostPeer) return;
        if (!NET.hostPeer) { NET.hostPeer = msg.peer; toast('加入成功！'); }
        if (NET.status) { NET.status = ''; renderCoop(); }
        applySnap(msg.data);
      }));
      clearTimeout(NET.joinTimer);
      NET.joinTimer = setTimeout(() => { if (NET.role === 'guest' && !NET.hostPeer) leaveRoom('找不到這個房間，請確認房號，或請房主把遊戲頁面打開。'); }, 7000);
      refreshUI(); renderInfo();
    } catch (e) {
      NET.role = 'solo'; NET.room = null; NET.status = '沒辦法加入，請稍後再試。'; renderCoop();
    }
  }

  function leaveRoom(msg) {
    const wasGuest = NET.role === 'guest';
    for (const off of NET.offs) { try { off(); } catch {} }
    NET.offs = [];
    if (NET.room) NET.room.leave().catch(() => {});
    NET.room = null; NET.role = 'solo'; NET.hostPeer = null; NET.code = ''; NET.lastSnap = 0;
    NET.status = typeof msg === 'string' ? msg : '';
    clearTimeout(NET.joinTimer);
    if (wasGuest) reset();
    for (const t of S.towers) t.owner = null;
    $('restart').hidden = false;
    renderCoop(); refreshUI(); renderInfo();
  }

  async function initNet() {
    try {
      const api = window.claude && window.claude.use ? await window.claude.use('room') : null;
      if (!api) throw 0;
      NET.api = api;
    } catch {
      NET.status = '在 Claude 的分享連結裡打開這個遊戲，才能和朋友連線。現在可以先自己玩。';
    }
    renderCoop();
  }

  // =====================================================================
  // Drawing
  // =====================================================================
  const bg = document.createElement('canvas');
  let dpr = 1;
  function sizeCanvas() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
  }
  function tracePoly(c, a) { c.beginPath(); for (let i = 0; i < a.length; i += 2) i ? c.lineTo(a[i], a[i+1]) : c.moveTo(a[i], a[i+1]); c.closePath(); }
  function traceLine(c, a) { c.beginPath(); for (let i = 0; i < a.length; i += 2) i ? c.lineTo(a[i], a[i+1]) : c.moveTo(a[i], a[i+1]); }

  function paintBackground() {
    bg.width = W * dpr; bg.height = H * dpr;
    const c = bg.getContext('2d'); c.scale(dpr, dpr);
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    c.lineJoin = 'round'; c.lineCap = 'round';
    // countryside
    c.fillStyle = '#86b25c'; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 900; i++) {
      c.fillStyle = rnd() > .5 ? 'rgba(52,96,36,.18)' : 'rgba(190,225,140,.18)';
      c.fillRect(rnd() * W, rnd() * H, 2, 2);
    }
    // farmland with furrows
    for (const a of MAP.farm) {
      c.save(); tracePoly(c, a); c.fillStyle = '#c4b27a'; c.fill(); c.clip();
      c.strokeStyle = 'rgba(120,96,50,.28)'; c.lineWidth = 2;
      for (let x = -200; x < W; x += 9) { c.beginPath(); c.moveTo(x, 0); c.lineTo(x + 300, H); c.stroke(); }
      c.restore();
    }
    // parks and riverbanks
    for (const a of MAP.park) { tracePoly(c, a); c.fillStyle = '#6fa24c'; c.fill(); }
    for (let i = 0; i < 80; i++) {   // gum trees along the river
      const x = rnd() * W, y = rnd() * H;
      if (!MAP.park.some(a => inPoly(x, y, a))) continue;
      c.fillStyle = 'rgba(30,70,30,.25)'; c.beginPath(); c.arc(x + 3, y + 4, 9, 0, 7); c.fill();
      c.fillStyle = rnd() > .5 ? '#4e8a3a' : '#5b9644'; c.beginPath(); c.arc(x, y, 9, 0, 7); c.fill();
    }
    // campus lawn with mowing stripes
    for (const a of MAP.campus) {
      c.save(); tracePoly(c, a); c.fillStyle = '#9ccc6c'; c.fill(); c.clip();
      c.fillStyle = 'rgba(255,255,255,.06)';
      for (let x = -H; x < W; x += 40) { c.beginPath(); c.moveTo(x,0); c.lineTo(x+20,0); c.lineTo(x+20+H,H); c.lineTo(x+H,H); c.fill(); }
      for (let i = 0; i < 260; i++) {
        const x = rnd() * W, y = rnd() * H;
        c.strokeStyle = rnd() > .5 ? 'rgba(60,110,40,.35)' : 'rgba(200,235,150,.4)'; c.lineWidth = 1.1;
        c.beginPath(); c.moveTo(x, y); c.lineTo(x - 2, y - 5); c.moveTo(x, y); c.lineTo(x + 2, y - 5); c.stroke();
      }
      c.restore();
      tracePoly(c, a); c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5; c.setLineDash([5, 4]); c.stroke(); c.setLineDash([]);
    }
    // Logan River
    for (const a of MAP.river) {
      tracePoly(c, a); c.fillStyle = '#3f86b8'; c.fill();
      c.strokeStyle = '#8fbf86'; c.lineWidth = 3; c.stroke();
      c.save(); tracePoly(c, a); c.clip();
      c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1.5;
      for (let i = 0; i < 70; i++) { const x = rnd() * W, y = rnd() * H; c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + 5, y - 3, x + 10, y); c.stroke(); }
      c.restore();
    }
    for (const a of MAP.creek) { traceLine(c, a); c.strokeStyle = '#3f86b8'; c.lineWidth = 4; c.stroke(); }
    // sports field
    for (const a of MAP.pitch) {
      c.save(); tracePoly(c, a); c.fillStyle = '#5aa845'; c.fill(); c.clip();
      c.fillStyle = 'rgba(255,255,255,.08)';
      for (let y = 240; y < 350; y += 14) c.fillRect(540, y, 100, 7);
      c.restore();
      tracePoly(c, a); c.strokeStyle = '#ffffff'; c.lineWidth = 2; c.stroke();
      const mx = (a[0]+a[2]+a[4]+a[6])/4, my = (a[1]+a[3]+a[5]+a[7])/4;
      c.beginPath(); c.moveTo((a[0]+a[6])/2, (a[1]+a[7])/2); c.lineTo((a[2]+a[4])/2, (a[3]+a[5])/2);
      c.moveTo((a[0]+a[2])/2, (a[1]+a[3])/2); c.lineTo((a[6]+a[4])/2, (a[7]+a[5])/2); c.stroke();
      c.beginPath(); c.arc(mx, my, 10, 0, 7); c.stroke();
    }
    // car park
    for (const a of MAP.parking) {
      tracePoly(c, a); c.fillStyle = '#8a8f93'; c.fill();
      c.save(); tracePoly(c, a); c.clip();
      c.strokeStyle = 'rgba(255,255,255,.6)'; c.lineWidth = 1;
      for (let t = 0; t < 1; t += .035) { const x = 388 + (553-388) * t, y = 110 + (208-110) * t; c.beginPath(); c.moveTo(x - 4, y + 7); c.lineTo(x + 4, y - 7); c.stroke(); }
      c.restore();
    }
    // roads
    for (const a of MAP.street) { traceLine(c, a); c.strokeStyle = '#5f6468'; c.lineWidth = 9; c.stroke(); }
    for (const a of MAP.drive) { traceLine(c, a); c.strokeStyle = '#7b8085'; c.lineWidth = 6; c.stroke(); }
    for (const a of MAP.avenue) { traceLine(c, a); c.strokeStyle = '#54595e'; c.lineWidth = 15; c.stroke(); }
    for (const a of MAP.avenue) { traceLine(c, a); c.strokeStyle = '#f2d36b'; c.lineWidth = 1.2; c.setLineDash([8, 7]); c.stroke(); c.setLineDash([]); }
    for (const a of [...MAP.foot, ...MAP.cycle]) { traceLine(c, a); c.strokeStyle = '#e3d6b2'; c.lineWidth = 2.5; c.stroke(); }
    // roundabout island
    c.fillStyle = '#7fb85a'; c.strokeStyle = '#e8e2cf'; c.lineWidth = 2; c.beginPath(); c.arc(345, 121, 7, 0, 7); c.fill(); c.stroke();

    // the balloon route, painted like a running track
    const route = (w, col) => { c.strokeStyle = col; c.lineWidth = w; c.beginPath(); c.moveTo(PATH[0][0], PATH[0][1]); for (const [x,y] of PATH.slice(1)) c.lineTo(x, y); c.stroke(); };
    route(PATH_W + 6, 'rgba(70,30,20,.35)');
    route(PATH_W, '#c8674a');
    route(PATH_W - 14, '#d3765a');
    c.setLineDash([10, 9]); route(1.5, 'rgba(255,255,255,.75)'); c.setLineDash([]);
    c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.5;
    route(PATH_W - 3, 'rgba(255,255,255,.0)');

    drawGoal(c);
    // labels
    const label = (text, x, y, rot = 0, size = 12, col = '#1f3a2a') => {
      c.save(); c.translate(x, y); c.rotate(rot); c.font = `700 ${size}px ${getComputedStyle(document.body).fontFamily}`;
      c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.75)'; c.strokeText(text, 0, 0);
      c.fillStyle = col; c.fillText(text, 0, 0); c.restore();
    };
    label('Anzac Avenue', 505, 108, Math.atan2(95, 175), 12, '#2b2f33');
    label('Logan River 洛根河', 150, 250, 1.25, 12, '#123a58');
    label('Logan River', 810, 120, 1.35, 11, '#123a58');
    label('運動場', 593, 300, -1.42, 11, '#ffffff');
    label('停車場', 452, 140, Math.atan2(95, 175), 10, '#2b2f33');
    label('Towns Park', 870, 300, 0, 11, '#1f4a20');
    c.font = `500 10px ${getComputedStyle(document.body).fontFamily}`; c.textAlign = 'right'; c.fillStyle = 'rgba(20,40,30,.75)';
    c.fillText('© OpenStreetMap contributors', W - 8, H - 8);
  }

  function drawGoal(c) {
    const {x, y, w, h} = GOAL;
    c.fillStyle = 'rgba(0,0,0,.22)'; c.fillRect(x + 6, y + 8, w, h);
    c.fillStyle = '#e9e1cf'; c.fillRect(x, y, w, h);
    c.fillStyle = '#7a3d33'; c.fillRect(x - 3, y - 6, w + 6, 9);
    c.fillStyle = '#bcd7e6';
    for (let r = 0; r < 3; r++) for (let k = 0; k < 5; k++) c.fillRect(x + 6 + k * 14.5, y + 9 + r * 16, 9, 9);
    c.fillStyle = '#4a3b2c'; c.fillRect(x + w - 18, y + h - 16, 12, 16);
    c.font = `900 11px ${getComputedStyle(document.body).fontFamily}`; c.textAlign = 'center';
    c.lineWidth = 4; c.strokeStyle = 'rgba(255,255,255,.85)'; c.strokeText('中學大樓', x + w/2, y + h + 15);
    c.fillStyle = '#3a2418'; c.fillText('中學大樓', x + w/2, y + h + 15);
  }

  function drawBalloon(c, b) {
    const p = bpos(b), inf = info(b.kind), slowed = b.slowUntil > S.time;
    if (b.kind === 'blimp') {
      const q = posAt(b.dist + 2), ang = Math.atan2(q.y - p.y, q.x - p.x);
      c.save(); c.translate(p.x, p.y);
      c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(6, 22, 40, 12, 0, 0, 7); c.fill();
      c.rotate(ang);
      c.fillStyle = inf.dark;
      c.beginPath(); c.moveTo(-30, 0); c.lineTo(-48, -16); c.lineTo(-42, 0); c.lineTo(-48, 16); c.closePath(); c.fill();
      c.fillStyle = inf.color; c.strokeStyle = inf.dark; c.lineWidth = 2.5;
      c.beginPath(); c.ellipse(0, 0, 44, 22, 0, 0, 7); c.fill(); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,.18)'; c.lineWidth = 2;
      for (const x of [-18, 0, 18]) { c.beginPath(); c.ellipse(x, 0, 5, 21, 0, 0, 7); c.stroke(); }
      c.fillStyle = 'rgba(255,255,255,.3)'; c.beginPath(); c.ellipse(-6, -10, 24, 5, 0, 0, 7); c.fill();
      c.fillStyle = '#2b2550'; c.fillRect(-10, 20, 20, 7);
      if (slowed) { c.strokeStyle = 'rgba(160,225,250,.9)'; c.lineWidth = 3; c.beginPath(); c.ellipse(0, 0, 46, 24, 0, 0, 7); c.stroke(); }
      c.restore();
      const w = 60, f = Math.max(0, Math.min(1, b.hp / inf.hp));
      c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(p.x - w/2, p.y - 38, w, 6);
      c.fillStyle = f > .5 ? '#7ee06a' : f > .25 ? '#f5cf3a' : '#ef5a46'; c.fillRect(p.x - w/2, p.y - 38, w * f, 6);
      return;
    }
    const r = inf.r, bob = Math.sin(S.time * 4 + b.id) * 1.2, x = p.x, y = p.y - 4 + bob;
    c.fillStyle = 'rgba(0,0,0,.16)'; c.beginPath(); c.ellipse(p.x + 3, p.y + 14, r * .7, r * .3, 0, 0, 7); c.fill();
    c.strokeStyle = 'rgba(60,45,30,.55)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(x, y + r); c.quadraticCurveTo(x + 4, y + r + 6, x, y + r + 12); c.stroke();
    c.fillStyle = inf.dark;
    c.beginPath(); c.moveTo(x, y + r - 2); c.lineTo(x - 3.5, y + r + 3); c.lineTo(x + 3.5, y + r + 3); c.closePath(); c.fill();
    c.fillStyle = inf.color; c.strokeStyle = inf.dark; c.lineWidth = 1.5;
    c.beginPath(); c.ellipse(x, y, r * .86, r, 0, 0, 7); c.fill(); c.stroke();
    if (b.kind === 'iron') {
      c.fillStyle = inf.dark;
      for (const [dx,dy] of [[-5,-2],[5,-2],[0,6],[-3,8],[3,8]]) { c.beginPath(); c.arc(x+dx*.9, y+dy*.7, 1.2, 0, 7); c.fill(); }
    }
    c.fillStyle = b.kind === 'iron' ? 'rgba(255,255,255,.6)' : 'rgba(255,255,255,.45)';
    c.beginPath(); c.ellipse(x - r * .35, y - r * .42, r * .2, r * .32, -.5, 0, 7); c.fill();
    if (slowed) {
      c.fillStyle = 'rgba(170,230,255,.35)'; c.strokeStyle = 'rgba(200,240,255,.9)'; c.lineWidth = 1.5;
      c.beginPath(); c.ellipse(x, y, r * .95, r * 1.08, 0, 0, 7); c.fill(); c.stroke();
    }
  }

  function ownerFlag(c, x, y, owner) {
    if (owner == null) return;
    c.fillStyle = '#3a2a1a'; c.fillRect(x + 13, y - 24, 1.6, 14);
    c.fillStyle = PLAYER_COLORS[owner]; c.beginPath(); c.moveTo(x + 14.6, y - 24); c.lineTo(x + 23, y - 20.5); c.lineTo(x + 14.6, y - 17); c.closePath(); c.fill();
  }

  function drawTower(c, type, x, y, ang, lvl, s = 1, time = 0, owner = null) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(2, 6, 20, 12, 0, 0, 7); c.fill();
    if (type === 'dart') {
      c.fillStyle = '#b8733a'; c.strokeStyle = '#6e4220'; c.lineWidth = 2.5;
      c.beginPath(); c.arc(0, 0, 17, 0, 7); c.fill(); c.stroke();
      c.fillStyle = '#d9955a'; c.beginPath(); c.arc(0, 0, 11, 0, 7); c.fill();
      c.rotate(ang);
      c.fillStyle = '#5a3a20'; c.fillRect(2, -4.5, 20, 9);
      c.fillStyle = '#efe8d4'; c.beginPath(); c.moveTo(22, -4); c.lineTo(30, 0); c.lineTo(22, 4); c.closePath(); c.fill();
      c.fillStyle = '#e5483b'; c.fillRect(4, -5.5, 5, 11);
    } else if (type === 'bomb') {
      c.fillStyle = '#4a4f57'; c.strokeStyle = '#25282d'; c.lineWidth = 2.5;
      roundRect(c, -17, -17, 34, 34, 7); c.fill(); c.stroke();
      c.rotate(ang);
      c.fillStyle = '#2d3036'; c.fillRect(0, -7.5, 24, 15);
      c.fillStyle = '#1b1d21'; c.fillRect(21, -9, 5, 18);
      c.fillStyle = '#6a717b'; c.beginPath(); c.arc(0, 0, 9.5, 0, 7); c.fill();
      c.fillStyle = '#f2b632'; c.beginPath(); c.arc(0, 0, 3.5, 0, 7); c.fill();
    } else if (type === 'frost') {
      c.fillStyle = '#c4e9f7'; c.strokeStyle = '#4f9fc2'; c.lineWidth = 2.5;
      c.beginPath();
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3 + Math.PI / 6; c.lineTo(Math.cos(a) * 18, Math.sin(a) * 18); }
      c.closePath(); c.fill(); c.stroke();
      c.rotate(time * .8);
      c.strokeStyle = '#3d8fb4'; c.lineWidth = 2.5; c.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        c.rotate(Math.PI / 3);
        c.beginPath(); c.moveTo(-10, 0); c.lineTo(10, 0); c.stroke();
        c.beginPath(); c.moveTo(6, 0); c.lineTo(9, -3); c.moveTo(6, 0); c.lineTo(9, 3); c.stroke();
      }
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(0, 0, 3.5, 0, 7); c.fill();
    } else if (type === 'sniper') {
      c.fillStyle = '#6b7a3a'; c.strokeStyle = '#3a4320'; c.lineWidth = 2.5;
      c.beginPath(); c.arc(0, 0, 16, 0, 7); c.fill(); c.stroke();
      c.strokeStyle = 'rgba(0,0,0,.25)'; c.lineWidth = 1.5;
      c.beginPath(); c.arc(0, 0, 11, 0, 7); c.stroke();
      c.rotate(ang);
      c.fillStyle = '#23271c'; c.fillRect(0, -2.8, 32, 5.6);
      c.fillRect(28, -4, 5, 8);
      c.fillStyle = '#3d4530'; roundRect(c, 2, -9, 14, 5, 2); c.fill();
      c.fillStyle = '#8fd3ee'; c.fillRect(14, -8.5, 2, 4);
      c.fillStyle = '#4b5730'; c.beginPath(); c.arc(0, 0, 7, 0, 7); c.fill();
    }
    c.restore();
    if (lvl > 0) {
      for (let i = 0; i <= lvl; i++) {
        const px = x - lvl * 4.5 + i * 9;
        c.fillStyle = '#f2b632'; c.strokeStyle = '#6b4c05'; c.lineWidth = 1.2;
        c.beginPath(); c.arc(px, y + 22 * s, 3.4, 0, 7); c.fill(); c.stroke();
      }
    }
    ownerFlag(c, x, y, owner);
  }

  // The hero: the player's photo in a ring, with an energy orb that points at the target.
  function drawHero(c, x, y, ang, s = 1, time = 0, owner = null, lvl = 0) {
    c.save(); c.translate(x, y); c.scale(s, s);
    c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(2, 8, 22, 12, 0, 0, 7); c.fill();
    const glow = .5 + .5 * Math.sin(time * 3);
    c.fillStyle = `rgba(95,196,240,${.18 + .12 * glow})`; c.beginPath(); c.arc(0, 0, 25, 0, 7); c.fill();
    c.save(); c.beginPath(); c.arc(0, 0, 19, 0, 7); c.clip();
    if (avatarImg && avatarImg.complete && avatarImg.naturalWidth) c.drawImage(avatarImg, -19, -19, 38, 38);
    else {
      c.fillStyle = '#f1c9a5'; c.fillRect(-19, -19, 38, 38);
      c.fillStyle = '#2a2320'; c.beginPath(); c.ellipse(0, -14, 20, 11, 0, 0, 7); c.fill();
      c.strokeStyle = '#222'; c.lineWidth = 1.6; c.beginPath(); c.arc(-6, 0, 4.5, 0, 7); c.moveTo(10.5, 0); c.arc(6, 0, 4.5, 0, 7); c.stroke();
      c.beginPath(); c.arc(0, 7, 4, .2, Math.PI - .2); c.stroke();
    }
    c.restore();
    c.strokeStyle = '#f2b632'; c.lineWidth = 3.5; c.beginPath(); c.arc(0, 0, 19.5, 0, 7); c.stroke();
    c.strokeStyle = '#5fc4f0'; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, 22.5, 0, 7); c.stroke();
    // energy orb
    const ox = Math.cos(ang) * 24, oy = Math.sin(ang) * 24;
    c.fillStyle = 'rgba(95,196,240,.45)'; c.beginPath(); c.arc(ox, oy, 7, 0, 7); c.fill();
    c.fillStyle = '#e9fbff'; c.beginPath(); c.arc(ox, oy, 3.6, 0, 7); c.fill();
    c.restore();
    if (s >= 1 && lvl >= 0) {
      c.fillStyle = '#16302a'; c.strokeStyle = '#f2b632'; c.lineWidth = 1.5;
      c.beginPath(); c.arc(x - 17 * s, y + 16 * s, 8, 0, 7); c.fill(); c.stroke();
      c.fillStyle = '#f2b632'; c.font = `400 11px ${getComputedStyle(document.body).fontFamily}`; c.textAlign = 'center';
      c.fillText(String(lvl + 1), x - 17 * s, y + 16 * s + 4);
    }
    ownerFlag(c, x, y, owner);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function drawRange(c, x, y, r, ok) {
    c.fillStyle = ok ? 'rgba(255,255,255,.16)' : 'rgba(239,90,70,.22)';
    c.strokeStyle = ok ? 'rgba(255,255,255,.8)' : 'rgba(239,90,70,.9)';
    c.lineWidth = 1.5; c.setLineDash([6, 5]);
    c.beginPath(); c.arc(x, y, Math.min(r, 1200), 0, 7); c.fill(); c.stroke();
    c.setLineDash([]);
  }

  function render() {
    const c = ctx, font = getComputedStyle(document.body).fontFamily;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.drawImage(bg, 0, 0, W, H);
    const sel = selected();
    if (sel) {
      const L = towerLevel(sel);
      if (L.range < 2000) drawRange(c, sel.x, sel.y, L.range, true);
    }
    const bs = S.balloons.slice().sort((a, b) => bpos(a).y - bpos(b).y);
    for (const b of bs) drawBalloon(c, b);
    for (const tw of S.towers) {
      if (tw.type === 'hero') drawHero(c, tw.x, tw.y, tw.ang, 1.15, S.time, tw.owner, tw.lvl);
      else drawTower(c, tw.type, tw.x, tw.y, tw.ang, tw.lvl, 1, S.time, tw.owner);
      if (tw === sel) { c.strokeStyle = '#f2b632'; c.lineWidth = 2.5; c.beginPath(); c.arc(tw.x, tw.y, 27, 0, 7); c.stroke(); }
    }
    const drawDart = (x, y, vx, vy) => {
      c.save(); c.translate(x, y); c.rotate(Math.atan2(vy, vx));
      c.fillStyle = '#3b2a18'; c.fillRect(-9, -1, 12, 2);
      c.fillStyle = '#f4efdf'; c.beginPath(); c.moveTo(3, -2.5); c.lineTo(8, 0); c.lineTo(3, 2.5); c.fill();
      c.fillStyle = '#e5483b'; c.fillRect(-10, -2.5, 3, 5);
      c.restore();
    };
    const drawOrb = (x, y) => {
      c.fillStyle = 'rgba(95,196,240,.45)'; c.beginPath(); c.arc(x, y, 8, 0, 7); c.fill();
      c.fillStyle = '#ffffff'; c.beginPath(); c.arc(x, y, 3.8, 0, 7); c.fill();
    };
    const drawBomb = (x, y) => {
      c.fillStyle = '#1c1e22'; c.beginPath(); c.arc(x, y, 6, 0, 7); c.fill();
      c.fillStyle = '#f2b632'; c.beginPath(); c.arc(x + 3, y - 5, 2, 0, 7); c.fill();
    };
    for (const s of S.shots) {
      if (s.type === 'dart') drawDart(s.x, s.y, s.vx, s.vy);
      else if (s.type === 'orb') drawOrb(s.x, s.y);
      else if (s.type === 'bomb') drawBomb(s.x, s.y);
    }
    for (const f of S.fx) {
      const k = f.life / f.max;
      if (f.type === 'bit') {
        c.globalAlpha = Math.min(1, k * 1.5); c.fillStyle = f.color;
        c.beginPath(); c.arc(f.x, f.y, 2.6, 0, 7); c.fill(); c.globalAlpha = 1;
      } else if (f.type === 'vdart') drawDart(f.x, f.y, f.vx, f.vy);
      else if (f.type === 'vorb') drawOrb(f.x, f.y);
      else if (f.type === 'vbomb') drawBomb(f.x, f.y);
      else if (f.type === 'ring') {
        c.strokeStyle = f.color; c.globalAlpha = k; c.lineWidth = 2.5;
        c.beginPath(); c.arc(f.x, f.y, f.r * (1.4 - k * .6), 0, 7); c.stroke(); c.globalAlpha = 1;
      } else if (f.type === 'boom') {
        const r = f.r * (1 - k * .5);
        c.fillStyle = `rgba(255,190,70,${.55 * k})`; c.beginPath(); c.arc(f.x, f.y, r, 0, 7); c.fill();
        c.fillStyle = `rgba(255,250,220,${.7 * k})`; c.beginPath(); c.arc(f.x, f.y, r * .45, 0, 7); c.fill();
      } else if (f.type === 'frost') {
        const r = f.r * (1 - k * .8);
        c.strokeStyle = `rgba(190,238,255,${k})`; c.fillStyle = `rgba(170,225,250,${.22 * k})`; c.lineWidth = 3;
        c.beginPath(); c.arc(f.x, f.y, r, 0, 7); c.fill(); c.stroke();
      } else if (f.type === 'blast') {
        const r = 40 + (1 - k) * 1100;
        c.strokeStyle = `rgba(150,225,255,${k})`; c.lineWidth = 10 * k + 2;
        c.beginPath(); c.arc(f.x, f.y, r, 0, 7); c.stroke();
        c.fillStyle = `rgba(200,240,255,${.25 * k})`; c.fillRect(0, 0, W, H);
      } else if (f.type === 'tracer') {
        c.strokeStyle = `rgba(255,245,200,${k})`; c.lineWidth = 2;
        c.beginPath(); c.moveTo(f.x1, f.y1); c.lineTo(f.x2, f.y2); c.stroke();
      } else if (f.type === 'text') {
        c.globalAlpha = k; c.fillStyle = f.color; c.font = '700 13px ' + font;
        c.textAlign = 'center'; c.fillText(f.text, f.x, f.y - (1 - k) * 12); c.globalAlpha = 1;
      }
    }
    if (S.placing && S.hover) {
      const ok = canPlace(S.hover.x, S.hover.y, S.placing) && canAfford(S.placing);
      const L = TOWERS[S.placing].levels[0];
      if (L.range < 2000) drawRange(c, S.hover.x, S.hover.y, L.range, ok);
      c.globalAlpha = .8;
      if (S.placing === 'hero') drawHero(c, S.hover.x, S.hover.y, -Math.PI / 2, 1.15, S.time, null, -1);
      else drawTower(c, S.placing, S.hover.x, S.hover.y, -Math.PI / 2, 0, 1, S.time, null);
      c.globalAlpha = 1;
      if (!ok) { c.strokeStyle = 'rgba(239,90,70,.95)'; c.lineWidth = 3; c.beginPath(); c.arc(S.hover.x, S.hover.y, 22, 0, 7); c.stroke(); }
    }
    if (!S.inRound && !S.over && S.round < WAVES.length) {
      const parts = WAVES[S.round].map(([k, n]) => `${info(k).name}×${n}`).join('  ');
      c.font = '700 13px ' + font; c.textAlign = 'left';
      const text = `下一波：${parts}`, w = c.measureText(text).width + 28;
      c.fillStyle = 'rgba(22,48,42,.82)'; roundRect(c, 12, 12, w, 28, 14); c.fill();
      c.fillStyle = '#f4efdf'; c.fillText(text, 26, 31);
    }
  }

  // =====================================================================
  // Loop
  // =====================================================================
  let last = performance.now(), snapClock = 0, fullClock = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if (NET.role === 'guest') guestStep(dt);
    else if (!S.over) { const sub = S.speed * 2; for (let i = 0; i < sub; i++) step(dt / 2); }
    else { S.time += dt; stepFx(dt); }
    if (NET.role === 'host' && NET.room) {
      snapClock += dt;
      if (snapClock >= .12) {
        snapClock = 0;
        NET.room.emit('snap', makeSnap(true)).catch(() => {});
        S.netfx = [];
      }
    } else S.netfx.length = 0;
    liveStats();
    render();
    requestAnimationFrame(frame);
  }
  let lastMoney = -1, lastLives = -1, lastAc = -1, liveClock = 0;
  function liveStats() {
    const ac = Math.ceil(S.abilityCd);
    if (S.money !== lastMoney || S.lives !== lastLives || ac !== lastAc) {
      lastMoney = S.money; lastLives = S.lives; lastAc = ac;
      $('lives').textContent = Math.max(0, S.lives);
      $('money').textContent = S.money;
      for (const type of TYPES) cardEls[type].disabled = (!canAfford(type) || (type === 'hero' && heroTaken())) && S.placing !== type;
      refreshAbility();
      renderInfo(false);
    }
  }

  sizeCanvas(); paintBackground();
  reset(); drawShopIcons(); renderCoop();
  window.addEventListener('resize', () => {
    const d = Math.min(2, window.devicePixelRatio || 1);
    if (d !== dpr) { sizeCanvas(); paintBackground(); }
  });
  if (document.fonts) document.fonts.ready.then(() => { paintBackground(); drawShopIcons(); }).catch(() => {});
  initNet();
  window.__game = { get state() { return S; }, step, startRound, TOWERS, applyAction, makeSnap, applySnap, NET, PATH_LEN };
  requestAnimationFrame(frame);
})();
</script>
